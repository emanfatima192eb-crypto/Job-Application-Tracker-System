
<!DOCTYPE html>
<html>
<head>
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Job Application Tracker</h1>

    <h2>Add New Application</h2>

    <form id="applicationForm">

        <label for="company">Company Name:</label>
        <input type="text" id="company" required>

        <label for="position">Job Position:</label>
        <input type="text" id="position" required>

        <label for="appliedDate">Applied Date:</label>
        <input type="date" id="appliedDate" required>

        <label for="salary">Salary:</label>
        <input type="number" id="salary" min="0" required>

        <button type="submit">Add Application</button>

    </form>
     <h2>Application Statistics</h2>

<p id="totalApplications">Total Applications: 0</p>
<p id="appliedCount">Applied: 0</p>
<p id="interviewCount">Interview: 0</p>
<p id="offeredCount">Offered: 0</p>
<p id="rejectedCount">Rejected: 0</p>
<h2>Application Actions</h2>

<button id="undoBtn">Undo</button>
<button id="redoBtn">Redo</button>

<h2>Activity History</h2>
<div id="activityHistory"></div>
    <h2>Job Applications</h2>

<input
    type="text"
    id="searchInput"
    placeholder="Search by company or position"
>

<select id="statusFilter">
    <option value="All">All Statuses</option>
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Offered">Offered</option>
    <option value="Rejected">Rejected</option>
</select>
<input
    type="number"
    id="minSalary"
    placeholder="Minimum Salary"
>

<input
    type="number"
    id="maxSalary"
    placeholder="Maximum Salary"
>
<select id="sortApplications">
    <option value="default">Sort Applications</option>
    <option value="dateAsc">Date: Oldest First</option>
    <option value="dateDesc">Date: Newest First</option>
    <option value="salaryAsc">Salary: Low to High</option>
    <option value="salaryDesc">Salary: High to Low</option>
</select>
<div id="applicationList"></div>

<div id="pagination">
    <button id="prevBtn">Previous</button>
    <span id="pageNumber">Page 1</span>
    <button id="nextBtn">Next</button>
</div>
    <script src="script.js"></script>


                                        
</body>
</html>
